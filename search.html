<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>탐색·추론 오프닝 상영관</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a classroom projection booth. Dark screening-room shell, one big 16:9 stage per lesson, notes panel beside it. Single dark look on purpose (projector). */
:root {
  color-scheme: dark;
  --bg: #0E1B27;
  --panel: #152738;
  --panel-2: #1C3247;
  --line: #2A4359;
  --fg: #E9F1F5;
  --muted: #8FA6B6;
  --teal: #2BC4B0;
  --amber: #F4A259;
  --coral: #EF6A4C;
  --violet: #9F86E3;
  --blue: #5C9BEA;
  --display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
header h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4vw, 40px); line-height: 1.1; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
header h1 span { color: var(--amber); }
header p { margin: 4px 0 0; color: var(--muted); }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tab { all: unset; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.tab:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.tab .k { font-size: 12px; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.tab .t { font-family: var(--display); font-size: 19px; line-height: 1.25; }
.tab[aria-selected="true"] { background: var(--panel-2); border-color: var(--c, var(--teal)); box-shadow: inset 0 -3px 0 var(--c, var(--teal)); }
.tab[aria-selected="true"] .k { color: var(--c, var(--teal)); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.screen { display: grid; gap: 10px; min-width: 0; }
.stage { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #0A141D; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.caption { position: absolute; left: 4%; right: 4%; bottom: 3.5%; text-align: center; pointer-events: none; }
.caption span { display: inline-block; background: rgba(6, 12, 18, 0.82); color: #FFFFFF; font-weight: 700; font-size: clamp(13px, 1.9vw, 21px); line-height: 1.45; padding: 6px 14px; border-radius: 8px; transition: opacity .25s; text-wrap: balance; }
.scene { position: absolute; top: 3%; right: 2.5%; font-family: var(--mono); font-size: clamp(10px, 1.2vw, 13px); color: var(--muted); background: rgba(6,12,18,.6); padding: 2px 8px; border-radius: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { all: unset; cursor: pointer; background: var(--panel-2); border: 1px solid var(--line); color: var(--fg); padding: 8px 14px; border-radius: 9px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.btn.primary { background: var(--amber); color: #1A1206; border-color: var(--amber); min-width: 92px; justify-content: center; }
.btn[aria-pressed="true"] { border-color: var(--teal); color: var(--teal); }
.sep { flex: 1 1 auto; }
.speed { display: inline-flex; gap: 4px; }
.speed .btn { padding: 8px 10px; font-family: var(--mono); font-size: 13px; }
.tryit { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
.tryit h3 { margin: 0; font-size: 15px; }
.tryit .row { display: flex; flex-wrap: wrap; gap: 8px; }
.tryit .status { font-family: var(--mono); color: var(--teal); font-size: 14px; }
aside { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
.card h2 { margin: 0; font-size: 12px; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.card p { margin: 0; }
.card .big { font-family: var(--display); font-size: 21px; line-height: 1.35; color: var(--fg); }
.card ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.card.teacher { background: transparent; border-style: dashed; }
.chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--panel-2); color: var(--c, var(--teal)); border: 1px solid var(--c, var(--teal)); width: fit-content; }
/* detective stage */
.case { position: absolute; inset: 0; padding: 3.2% 3.2% 12%; display: grid; grid-template-rows: auto auto 1fr; gap: 2.4%; font-size: clamp(9px, 1.35vw, 15px); }
.case .story { font-family: var(--display); font-size: clamp(14px, 2.3vw, 26px); color: var(--amber); line-height: 1.2; }
.suspects { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2%; }
.sus { background: #13293A; border: 2px solid #2A4359; border-radius: 10px; padding: 4% 6%; display: grid; gap: 2px; transition: all .4s; opacity: 0; transform: translateY(8px); }
.sus.show { opacity: 1; transform: none; }
.sus b { font-size: 1.25em; }
.sus small { color: var(--muted); }
.sus .tag { font-weight: 700; font-size: .9em; color: var(--muted); }
.sus.out { opacity: .38; filter: grayscale(1); }
.sus.out b { text-decoration: line-through; text-decoration-thickness: 2px; }
.sus.hit { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(239,106,76,.35); }
.sus.hit .tag { color: var(--coral); }
.sus.chk { border-color: var(--violet); }
.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2.4%; min-height: 0; }
.col { background: #101F2C; border: 1px solid #22394D; border-radius: 10px; padding: 2.5% 3.5%; display: grid; align-content: start; gap: 5px; min-height: 0; overflow: hidden; }
.col h4 { margin: 0; font-size: .85em; letter-spacing: .08em; color: var(--muted); }
.item { opacity: 0; transform: translateX(-6px); transition: all .35s; line-height: 1.4; }
.item.show { opacity: 1; transform: none; }
.item .n { font-family: var(--mono); font-weight: 700; color: var(--teal); margin-right: 4px; }
.col.rules .item .n { color: var(--violet); }
.item.fire { color: #FFFFFF; }
@media (max-width: 960px) { .main { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) { .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tab .t { font-size: 16px; } }
@media (prefers-reduced-motion: reduce) { .sus, .item, .caption span { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>탐색과 추론 <span>오프닝 상영관</span></h1>
      <p>인공지능 기초 Ⅰ-2 · 차시 시작 3~5분 동기유발 영상 · 재생 전에 예측 질문부터 던지세요</p>
    </div>
    <button class="btn" id="fsBtn" type="button">전체 화면</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="차시 선택">
    <button class="tab" role="tab" id="tab1" aria-selected="true" style="--c: var(--teal)"><span class="k">1차시 · 상태 공간</span><span class="t">비커 미션</span></button>
    <button class="tab" role="tab" id="tab2" aria-selected="false" style="--c: var(--blue)"><span class="k">2차시 · 맹목적 탐색</span><span class="t">미로 레이스</span></button>
    <button class="tab" role="tab" id="tab3" aria-selected="false" style="--c: var(--amber)"><span class="k">3차시 · 정보 이용 탐색</span><span class="t">편의점 가는 길</span></button>
    <button class="tab" role="tab" id="tab4" aria-selected="false" style="--c: var(--violet)"><span class="k">4차시 · 지식과 추론</span><span class="t">AI 탐정</span></button>
  </nav>

  <div class="main">
    <section class="screen">
      <div class="stage" id="stage">
        <canvas id="cv" width="960" height="540" aria-label="동기유발 애니메이션"></canvas>
        <div class="case" id="case" hidden>
          <div class="story" id="story">사라진 실험 노트</div>
          <div class="suspects" id="suspects"></div>
          <div class="board">
            <div class="col clues"><h4>단서 (사실)</h4><div id="clues" style="display:grid;gap:5px"></div></div>
            <div class="col rules"><h4>추론 규칙 적용</h4><div id="rules" style="display:grid;gap:5px"></div></div>
          </div>
        </div>
        <div class="scene" id="scene">준비</div>
        <div class="caption"><span id="cap">재생 버튼을 누르세요</span></div>
      </div>
      <div class="controls">
        <button class="btn primary" id="playBtn" type="button">▶ 재생</button>
        <button class="btn" id="restartBtn" type="button">↺ 처음부터</button>
        <span class="sep"></span>
        <span class="speed" role="group" aria-label="재생 속도">
          <button class="btn" data-sp="0.75" type="button" aria-pressed="false">0.75×</button>
          <button class="btn" data-sp="1" type="button" aria-pressed="true">1×</button>
          <button class="btn" data-sp="1.5" type="button" aria-pressed="false">1.5×</button>
          <button class="btn" data-sp="2" type="button" aria-pressed="false">2×</button>
        </span>
      </div>
      <div class="tryit" id="tryit">
        <h3>직접 해보기: 학생이 나와서 비커를 조작해 보세요</h3>
        <div class="row">
          <button class="btn" data-op="0" type="button">A 채우기</button>
          <button class="btn" data-op="1" type="button">B 채우기</button>
          <button class="btn" data-op="2" type="button">A 비우기</button>
          <button class="btn" data-op="3" type="button">B 비우기</button>
          <button class="btn" data-op="4" type="button">A → B 붓기</button>
          <button class="btn" data-op="5" type="button">B → A 붓기</button>
          <button class="btn" id="tryReset" type="button">처음 상태로</button>
        </div>
        <div class="status" id="tryStatus">상태 (0, 0) · 조작 0번</div>
      </div>
    </section>

    <aside id="notes"></aside>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 960, H = 540;
const C = { bg: '#0A141D', panel: '#13293A', line: '#2A4359', fg: '#E9F1F5', muted: '#8FA6B6', teal: '#2BC4B0', amber: '#F4A259', coral: '#EF6A4C', violet: '#9F86E3', blue: '#5C9BEA', wall: '#3A5468' };
const F = (w, s) => w + ' ' + s + 'px "Noto Sans KR", "Malgun Gothic", sans-serif';
const M = (w, s) => w + ' ' + s + 'px "JetBrains Mono", Consolas, monospace';
const capEl = document.getElementById('cap'), sceneEl = document.getElementById('scene');
function caption(t) { capEl.style.opacity = 0; setTimeout(() => { capEl.textContent = t; capEl.style.opacity = 1; }, 120); }
function scene(i, n) { sceneEl.textContent = '장면 ' + i + ' / ' + n; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(t, x, y, font, color, align) { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y); }

// ---------- player engine ----------
const STOP = { stop: true };
let runId = 0, paused = true, speed = 1, started = false, ended = false;
let waiters = [];
function wait(ms) { const id = runId; return new Promise((res, rej) => waiters.push({ left: ms, id, res, rej })); }
async function until(cond) { while (!cond()) await wait(60); }
let film = null, last = performance.now();
function loop(t) {
  const dt = Math.min(60, t - last); last = t;
  const live = [];
  for (const w of waiters) {
    if (w.id !== runId) { w.rej(STOP); continue; }
    if (!paused) w.left -= dt * speed;
    if (w.left <= 0) w.res(); else live.push(w);
  }
  waiters = live;
  if (film && film.render) { film.render(paused ? 0 : dt * speed); }
  requestAnimationFrame(loop);
}
const playBtn = document.getElementById('playBtn');
function syncBtn() { playBtn.textContent = (!started || ended) ? '▶ 재생' : (paused ? '▶ 계속' : '⏸ 일시정지'); }
function start() {
  runId++; const id = runId; started = true; ended = false; paused = false;
  film.reset();
  film.script().catch(e => { if (e !== STOP) console.error(e); }).then(() => { if (id === runId) { ended = true; paused = true; syncBtn(); } });
  syncBtn();
}
playBtn.addEventListener('click', () => { if (!started || ended) start(); else { paused = !paused; syncBtn(); } });
document.getElementById('restartBtn').addEventListener('click', start);
document.querySelectorAll('[data-sp]').forEach(b => b.addEventListener('click', () => {
  speed = +b.dataset.sp; document.querySelectorAll('[data-sp]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
}));
document.getElementById('fsBtn').addEventListener('click', () => {
  const el = document.getElementById('stage');
  try { const p = el.requestFullscreen && el.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
});

// ---------- film 1: beakers ----------
const OPS = ['A 가득 채우기', 'B 가득 채우기', 'A 비우기', 'B 비우기', 'A → B 옮겨 붓기', 'B → A 옮겨 붓기'];
function applyOp(s, i) { const a = s[0], b = s[1], t1 = Math.min(a, 3 - b), t2 = Math.min(b, 5 - a); return [[5, b], [a, 3], [0, b], [a, 0], [a - t1, b + t1], [a + t2, b - t2]][i]; }
const jug = (() => {
  const nodes = [{ s: [0, 0], p: -1, op: -1, lv: 0 }], seen = new Set(['0,0']); let q = [0], goal = -1;
  while (q.length && goal < 0) {
    const i = q.shift();
    for (let k = 0; k < 6 && goal < 0; k++) {
      const n = applyOp(nodes[i].s, k), key = n.join(',');
      if (seen.has(key)) continue; seen.add(key);
      nodes.push({ s: n, p: i, op: k, lv: nodes[i].lv + 1 }); q.push(nodes.length - 1);
      if (n[0] === 4) goal = nodes.length - 1;
    }
  }
  const byLv = {}; nodes.forEach((n, i) => { (byLv[n.lv] = byLv[n.lv] || []).push(i); });
  for (const lv in byLv) byLv[lv].forEach((i, k, arr) => { nodes[i].x = 430 + (k + 1) * (500 / (arr.length + 1)); nodes[i].y = 52 + lv * 60; });
  const path = []; for (let i = goal; i >= 0; i = nodes[i].p) path.unshift(i);
  return { nodes, goal, path };
})();
const f1 = {
  reset() { this.st = [0, 0]; this.d = [0, 0]; this.shown = 0; this.app = []; this.hlPath = false; this.goalOn = false; this.op = ''; this.cur = -1; caption('재생 버튼을 누르세요'); scene(0, 6); },
  render(dt) {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 2; i++) this.d[i] += (this.st[i] - this.d[i]) * Math.min(1, 0.006 * (dt || 16));
    // beakers
    const beaker = (x, w, cap, amt, label) => {
      const unit = 50, h = cap * unit, y = 420 - h;
      ctx.fillStyle = '#5FB8E8'; ctx.globalAlpha = 0.85; ctx.fillRect(x + 4, 420 - amt * unit, w - 8, amt * unit - 3); ctx.globalAlpha = 1;
      ctx.strokeStyle = C.fg; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, 420); ctx.lineTo(x + w, 420); ctx.lineTo(x + w, y); ctx.stroke();
      text(label, x + w / 2, 445, F(700, 18), C.fg, 'center');
      text(Math.round(amt * 10) / 10 + 'L', x + w / 2, y - 18, M(700, 18), C.teal, 'center');
    };
    beaker(70, 120, 5, this.d[0], 'A · 5L');
    beaker(240, 100, 3, this.d[1], 'B · 3L');
    text('(' + this.st[0] + ', ' + this.st[1] + ')', 205, 70, M(700, 40), C.amber, 'center');
    text('상태 = (A의 물, B의 물)', 205, 112, F(500, 15), C.muted, 'center');
    if (this.op) text(this.op, 205, 150, F(700, 18), C.fg, 'center');
    // tree
    ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(400, 30); ctx.lineTo(400, 470); ctx.stroke();
    text('AI가 펼치는 상태 공간', 680, 22, F(700, 14), C.muted, 'center');
    const onPath = new Set(this.hlPath ? jug.path : []);
    for (let i = 1; i < this.shown; i++) {
      const n = jug.nodes[i], p = jug.nodes[n.p], k = this.app[i] || 0;
      ctx.strokeStyle = onPath.has(i) && onPath.has(n.p) ? C.amber : C.wall; ctx.lineWidth = onPath.has(i) ? 3.5 : 1.5; ctx.globalAlpha = k;
      ctx.beginPath(); ctx.moveTo(p.x, p.y + 13); ctx.lineTo(n.x, n.y - 13); ctx.stroke(); ctx.globalAlpha = 1;
    }
    for (let i = 0; i < this.shown; i++) {
      this.app[i] = Math.min(1, (this.app[i] || 0) + (dt || 0) / 350);
      const n = jug.nodes[i], k = this.app[i], w = 64 * (0.6 + 0.4 * k), h = 26 * (0.6 + 0.4 * k);
      const isGoal = i === jug.goal && this.goalOn, cur = i === this.cur;
      ctx.globalAlpha = k;
      ctx.fillStyle = isGoal ? C.coral : onPath.has(i) ? C.amber : cur ? C.teal : C.panel;
      rr(n.x - w / 2, n.y - h / 2, w, h, 7); ctx.fill();
      ctx.strokeStyle = cur ? C.teal : C.line; ctx.lineWidth = 1.5; ctx.stroke();
      text('(' + n.s[0] + ',' + n.s[1] + ')', n.x, n.y + 1, M(700, 13), (isGoal || onPath.has(i)) ? '#1A1206' : C.fg, 'center');
      ctx.globalAlpha = 1;
    }
  },
  async script() {
    scene(1, 6); caption('눈금 없는 5L 비커 A와 3L 비커 B. 이 두 개만으로 정확히 4L를 만들 수 있을까?'); await wait(4200);
    scene(2, 6); caption('AI는 먼저 지금 모습을 숫자로 적는다. 이것이 \'상태\' (0, 0)'); this.shown = 1; this.cur = 0; await wait(3200);
    caption('할 수 있는 행동은 6가지: 채우기 2, 비우기 2, 옮겨 붓기 2'); await wait(3400);
    scene(3, 6); caption('모든 행동을 한 층씩 시도하며 상태를 펼친다. 이미 나온 상태는 버린다');
    for (let i = 1; i < jug.nodes.length; i++) {
      const n = jug.nodes[i]; this.cur = n.p; this.st = n.s.slice(); this.op = OPS[n.op]; this.shown = i + 1; await wait(850);
    }
    this.cur = -1; this.goalOn = true;
    scene(4, 6); caption(jug.nodes[jug.goal].lv + '번째 층에서 (4, 3) 발견! A에 정확히 4L'); await wait(3000);
    scene(5, 6); this.hlPath = true; caption('목표에서 거꾸로 따라 올라가면 가장 짧은 방법이 나온다'); this.st = [0, 0]; this.op = '처음 상태'; await wait(2600);
    for (let k = 1; k < jug.path.length; k++) {
      const n = jug.nodes[jug.path[k]]; this.st = n.s.slice(); this.op = k + '단계 · ' + OPS[n.op];
      caption(k + '단계 · ' + OPS[n.op] + ' → (' + n.s[0] + ', ' + n.s[1] + ')'); await wait(2000);
    }
    scene(6, 6); caption('문제를 \'상태\'와 \'행동\'으로 바꾸면 AI는 탐색으로 답을 찾는다. 오늘 배울 내용!'); await wait(4000);
  }
};

// ---------- shared grid search ----------

    after: ['탐욕 AI가 붐비는 골목으로 들어간 이유는?', 'A*가 골목을 피한 비결은 g와 h 중 무엇일까?'],
    tip: 'h = 맨해튼 거리, g = 지금까지 걸린 시간. 탐욕은 h만 보고 붐비는 골목을 통과해 오래 걸리고, A*는 균일 비용 탐색과 같은 최단 시간 경로를 더 적은 확장으로 찾는다.' },
  { c: 'var(--violet)', chip: '4차시 · 지식과 추론', q: '탐정은 어떻게 범인을 맞힐까?',
    before: ['용의자 소개 뒤 잠시 멈추고 범인 예측', '단서가 나올 때마다 누가 제외될지 맞히기'],
    after: ['AI 탐정이 쓴 규칙을 IF-THEN으로 하나 더 만들면?', '전향 추론과 후향 추론은 출발점이 어떻게 다른가?'],
    tip: '단서 3의 보라색 불꽃 = K⁺로 활동 4의 시료 판별 규칙과 연결된다. 마지막 장면은 후향 추론 예시.' },
];
const notesEl = document.getElementById('notes');
function renderNotes(i) {
  const n = NOTES[i];
  notesEl.innerHTML = '<div class="card" style="--c:' + n.c + '"><span class="chip">' + n.chip + '</span><h2>핵심 질문</h2><p class="big">' + n.q + '</p></div>' +
    '<div class="card"><h2>재생 전 · 예측하기</h2><ol>' + n.before.map(x => '<li>' + x + '</li>').join('') + '</ol></div>' +
    '<div class="card"><h2>재생 후 · 생각 나누기</h2><ol>' + n.after.map(x => '<li>' + x + '</li>').join('') + '</ol></div>' +
    '<div class="card teacher"><h2>교사용 메모</h2><p>' + n.tip + '</p></div>';
}

// ---------- tabs ----------
const FILMS = [f1, f2, f3, f4];
const tabs = [...document.querySelectorAll('.tab')];
function select(i) {
  tabs.forEach((t, k) => t.setAttribute('aria-selected', k === i ? 'true' : 'false'));
  runId++; paused = true; started = false; ended = false;
  film = FILMS[i]; film.reset(); syncBtn(); renderNotes(i);
  caseEl.hidden = i !== 3; document.getElementById('tryit').hidden = i !== 0;
  if (i === 3) { for (let k = 0; k < 4; k++) document.getElementById('sus' + k).classList.add('show'); }
  try { localStorage.setItem('opening-tab', String(i)); } catch (e) {}
}
tabs.forEach((t, i) => t.addEventListener('click', () => select(i)));

// ---------- try-it (film 1) ----------
let tryS = [0, 0], tryN = 0;
const tryStatus = document.getElementById('tryStatus');
function tryShow(msg) { tryStatus.textContent = '상태 (' + tryS[0] + ', ' + tryS[1] + ') · 조작 ' + tryN + '번' + (msg ? ' · ' + msg : ''); }
document.querySelectorAll('[data-op]').forEach(b => b.addEventListener('click', () => {
  if (film !== f1) return;
  if (started && !ended) { runId++; started = false; paused = true; syncBtn(); }
  const op = +b.dataset.op, n = applyOp(tryS, op);
  if (n[0] === tryS[0] && n[1] === tryS[1]) { tryShow('변화 없음'); return; }
  tryS = n; tryN++; f1.st = n.slice(); f1.op = OPS[op]; f1.shown = 0; f1.hlPath = false;
  if (n[0] === 4) { caption('성공! ' + tryN + '번 만에 A에 4L. AI는 최소 몇 번에 할까? ▶ 재생'); tryShow('성공!'); }
  else { caption('직접 해보기 · ' + OPS[op] + ' → (' + n[0] + ', ' + n[1] + ')'); tryShow(); }
}));
document.getElementById('tryReset').addEventListener('click', () => { tryS = [0, 0]; tryN = 0; f1.st = [0, 0]; f1.op = ''; caption('직접 해보기 · 처음 상태 (0, 0)'); tryShow(); });

let startTab = 0; try { const v = +localStorage.getItem('opening-tab'); if (v >= 0 && v < 4) startTab = v; } catch (e) {}
select(startTab);
window.__test = { jug, maze, city };
requestAnimationFrame(loop);
})();
</script>
